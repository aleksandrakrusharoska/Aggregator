name: Date Backfill (pazar3)

on:
  workflow_dispatch:  # trigger manually from GitHub Actions tab
  schedule:
    - cron: '0 9 * * *'  # daily at 09:00 UTC = 11:00 Macedonia time (UTC+2)

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Backfill posted_date from listing pages
        run: |
          scrapy crawl pazar3_date_backfill \
            -s LOG_LEVEL=INFO
