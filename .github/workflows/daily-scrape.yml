name: Daily Scrape

on:
  schedule:
    - cron: "0 3 * * *" # UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode"
        required: true
        type: choice
        options:
          - incremental
          - full
        default: incremental

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapy_project/requirements.txt

      - name: Run scrape and store
        working-directory: scrapy_project
        env:
          SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'incremental' }}
        run: |
          python scrape_and_store.py --mode "$SCRAPE_MODE"

      - name: Upload DB and JSONL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraped-output-${{ github.run_id }}
          path: |
            scrapy_project/scraped_ads.db
            scrapy_project/*_items.jl
          if-no-files-found: warn
